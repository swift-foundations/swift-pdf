name: Bug report
description: Report reproducible incorrect behavior in this repository.
title: ""
type: Bug
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private security-reporting link in the template chooser.
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest complete example and exact commands.
      render: swift
    validations:
      required: true
  - type: input
    id: swift
    attributes:
      label: Swift version
      placeholder: Output of swift --version
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Operating system, architecture, and relevant SDK
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add logs, links, or constraints that help reproduce the problem.
