name: Windows 6.4 proof

# swift-pdf-OWNED, NON-centralized proof job (deliberately NOT added to the
# universal reusable — per principal direction). It empirically proves that the
# Swift 6.3.3 Windows (+Asserts) debug-info-mangler crash on the `any HTML.View`
# existential (Assertion `isActuallyCanonicalOrNull()`, AST/Type.h:421) is
# resolved on Swift 6.4.
#
# Background: HTML.View refines the move-only Render.View (~Copyable) with a
# recursive `Body: HTML.View` constraint; its Copyable existential `any HTML.View`
# is non-canonical for the 6.3.3 Windows debug-info mangler. Explicit-existential
# removal cleared the whole cohort (html-render/css/markdown Windows-green), but
# the last site — swift-pdf-html-render's `PDF.HTML.Context.apply(inlineStyle:)` —
# forms `any HTML.View` IMPLICITLY from legitimate `<H: HTML.View>` generic
# constraints, which cannot be removed without breaking the public API. The code
# is correct; the compiler is buggy. My local repro does not reproduce on a
# 6.5-dev snapshot, indicating an upstream fix. This job is the empirical proof
# on 6.4 for the Windows target specifically.
#
# ADVISORY (continue-on-error): 6.4 is pre-release and this proves a compiler
# fix, it must not gate merges. The standard 6.3 Windows leg (universal reusable)
# stays red on this one module until the ecosystem 6.4 move.
# WHEN TO REMOVE: when the ecosystem moves to 6.4 (project_swift_64_move_...) and
# the standard Windows leg is green — then this proof is redundant.
# TRACKING: swift-institute/Issues — win-anyview-debuginfo-mangling.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: win64-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-6-4:
    name: Windows (Swift 6.4, debug) — any-HTML.View 6.4-fix proof
    if: ${{ !github.event.repository.private }}
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Harden runner (audit-mode egress logging)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@v6

      - uses: swift-institute/.github/.github/actions/configure-private-repos@main
        with:
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          app-client-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_CLIENT_ID }}
          app-id: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_ID }}
          app-private-key: ${{ secrets.SWIFT_INSTITUTE_BOT_APP_PRIVATE_KEY }}
          enabled: true

      # Swift 6.4. If setup-swift cannot yet resolve a 6.4 toolchain on Windows
      # (6.4 is pre-release until the ~Sept move), this step fails and the job —
      # being continue-on-error — records that without gating; bump to a specific
      # 6.4 development-snapshot tag if needed.
      - name: Install Swift 6.4
        uses: SwiftyLab/setup-swift@38f54a76b70d989321de9dc7c840618c08cf56e9 # v1.14.0
        with:
          swift-version: "6.4"

      - name: Print toolchain info
        run: |
          swift --version
          echo "Runner: ${{ runner.os }}"

      # The crash is an IRGen/debug-info build crash surfaced during the test
      # target's compile of swift-pdf-html-render — `--build-tests` reproduces it
      # without running tests (snapshot-test portability is a separate concern).
      # A green build here is the proof: the any-HTML.View mangler crash is gone.
      - name: Build (debug, incl. tests) — proof the crash is fixed
        run: swift build --build-tests -c debug
